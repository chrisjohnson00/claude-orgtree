# The full tier: every suite at full depth, including the live rigs that the fast tier (`tests.yml`) skips or runs in
# reduced mode — `message-visibility-live`, and `turn-lifecycle`, `compaction`, `external-mail`, `sqlite-store` and
# `rig-port-allocation` without `--hermetic`/`--quick`. Those spawn a real uvicorn, a fake Claude CLI and assert on
# real elapsed time, so they take ~13 min end to end and want an unloaded machine. That is why they are a nightly and
# on-demand gate rather than a per-push one.
#
# Every provider CLI here is a fake (`fakecli.js`, `fakecodex.py`, `fakeantigravity.py`); nothing bills a model.
# Opt-in modes (`--real-cli`, `--docker`, `--discriminate`, `--legacy-client`) are never driven by the runner;
# `--real-cli` is the one that bills a paid model.

name: full tests

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: full tier · ubuntu-latest
    runs-on: ubuntu-latest
    # the runner's per-suite cap in --full is 90 min; this bounds the whole run
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'

    steps:
      # `runner` is not available in job-level env, so the data root is exported here
      - run: |
          mkdir -p "$RUNNER_TEMP/orgtree-data"
          echo "ORGTREE_DATA=$RUNNER_TEMP/orgtree-data" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 2026-07-20

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 2026-07-20
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      # also the runtime for the live rigs' fake Claude CLI
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 2026-07-14
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - name: run_tests.py (full tier)
        run: python tools/run_tests.py --full --logdir testlogs

      - name: suite logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 2026-04-10
        with:
          name: full-testlogs-ubuntu-latest
          path: testlogs/
          if-no-files-found: ignore
          retention-days: 14
