# The fast tier, on every push and PR. This fork is Linux-only: orgtree runs
# and is developed on Linux, and CI runs the same fast tier `tools/run_tests.py`
# runs anywhere — `--list` shows the full plan, and the runner's own skip
# reasons (a live rig too slow for the fast tier, and so on) are unrelated to
# platform.
#
# Only the FAST tier runs in CI. The full tier includes live rigs that spawn a
# real uvicorn, a fake Claude CLI and real elapsed time. Measured on the dev
# box: turn-lifecycle 7.4 min, message-visibility-live 3.6 min (1.8 at
# --quick), ~13 min end to end. Run it before a release, on a real machine:
#     python tools/run_tests.py --full

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast tier · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      ORGTREE_DATA: ${{ runner.temp }}/orgtree-data

    steps:
      - uses: actions/checkout@v4

      # 3.11 is the floor the README declares. ⚠ Worth knowing: the dev box
      # actually runs 3.10.11 and the whole fast tier passes there, so the
      # declared floor and the measured floor disagree by one minor version.
      # CI tests the declared contract; if you ever rely on a 3.11-only
      # feature, CI will be happy and the dev box will not.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      # the repo's own declared typecheck script — cheap, and `tsc` clean was
      # one of the two gates that existed before this workflow
      - run: npm run typecheck
        working-directory: frontend

      - name: run_tests.py (fast tier)
        run: python tools/run_tests.py --logdir testlogs

      - name: suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-ubuntu-latest
          path: testlogs/
          if-no-files-found: ignore
          retention-days: 14
